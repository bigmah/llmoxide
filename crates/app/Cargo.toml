[package]
name = "llmoxide-app"
description = "Private desktop chat over the llmoxide engine: Dioxus UI rendered in-process, nothing written to disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
llmoxide = { workspace = true, features = ["gpu", "private"] }
chat.workspace = true
secret.workspace = true
serde_json.workspace = true
futures = "0.3"
# The model picker: the platform's own open dialog (NSOpenPanel, the Windows
# common dialog, the XDG portal on Linux). Used directly rather than through
# dioxus-native's `file_dialog`, which is for `<input type=file>`.
rfd = "0.17"
# The native renderer (Blitz: winit + vello), not the webview one. With a
# webview the conversation would be rendered by WebKit's own processes —
# outside this process's locked, self-zeroing memory, and free to keep caches
# under ~/Library/WebKit. Default features are off on purpose; each one left
# out is a capability the binary does not have:
#   net           — an HTTP client (reqwest) for fetching remote resources
#   hot-reload    — a websocket to the `dx` devserver, which can hot-patch
#                   code. Left *on*, only because 0.7.10 does not compile
#                   without it (`Config::default` calls `dioxus-cli-config`,
#                   which only this feature pulls in). Its connect code is
#                   compiled only with `debug_assertions`, so a release build
#                   has none; a debug build only dials out when
#                   DIOXUS_DEVSERVER_PORT is set, which `main` unsets.
#   accessibility — publishes every message to the OS accessibility tree,
#                   readable by any app granted accessibility access
#   clipboard     — see the `clipboard` feature below
#   file_dialog   — for `<input type=file>`; the model picker uses rfd
#                   directly
dioxus-native = { version = "0.7.10", default-features = false, features = ["prelude", "system-fonts", "autofocus", "hot-reload"] }

[features]
# System clipboard in the input box. Off by default: whatever is copied lands
# on the shared pasteboard, which every other app can read and clipboard
# managers keep a history of.
clipboard = ["dioxus-native/clipboard"]
