[package]
name = "gpu"
version.workspace = true
edition.workspace = true

[dependencies]
gguf = { path = "../gguf" }
model = { path = "../model" }
anyhow.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
half.workspace = true
tokenizer = { path = "../tokenizer" }
tracing.workspace = true
futures-channel = { version = "0.3", default-features = false, features = ["std"] }

# `pollster` blocks a thread, which a browser's main thread may not do, and
# `naga` is only here for the `msl` tool. Neither belongs in the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
naga = { version = "27", features = ["wgsl-in", "msl-out"] }

[[bin]]
name = "msl"
path = "src/bin/msl.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "kernels"
path = "src/bin/kernels.rs"

[[bin]]
name = "bisect"
path = "src/bin/bisect.rs"

[[bin]]
name = "bisect_qwen35"
path = "src/bin/bisect_qwen35.rs"

[[bin]]
name = "upload_check"
path = "src/bin/upload_check.rs"

[[bin]]
name = "wipe_check"
path = "src/bin/wipe_check.rs"
