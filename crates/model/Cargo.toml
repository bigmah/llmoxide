[package]
name = "llmoxide-model"
description = "Architecture configs, CPU reference forward passes, and sampling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Guaranteed-not-elided overwrites in the `wipe` paths, via `llmoxide-secret`.
# Off by default so an inference-only consumer does not link a crate that
# declares `mlock`, `ptrace` and `PT_DENY_ATTACH`.
private = ["dep:secret"]

[dependencies]
gguf.workspace = true
secret = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# rayon builds for wasm but panics the moment a pool is created; `ops::serial`
# stands in there instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
