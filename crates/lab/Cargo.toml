# The engine behind the browser demo on the llmoxide blog post: a dense
# transformer forward small enough to read in one sitting, with probes that
# hand its insides (attention, the residual stream, the logit lens) to a page.
#
# Outside the workspace for the same reason as crates/wasm: it is built for
# wasm32 by scripts/build-lab.sh, and as a member it would pull wasm-bindgen
# into every native build. It also builds natively, for `lab_check`.
[package]
name = "llmoxide-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gguf = { package = "llmoxide-gguf", path = "../gguf" }
tokenizer = { package = "llmoxide-tokenizer", path = "../tokenizer" }
model = { package = "llmoxide-model", path = "../model", features = ["private"] }
secret = { package = "llmoxide-secret", path = "../secret" }
anyhow = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must match the wasm-bindgen CLI exactly; the same pin as crates/wasm.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[[bin]]
name = "lab_check"
path = "src/bin/lab_check.rs"
