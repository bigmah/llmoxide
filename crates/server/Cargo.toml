[package]
name = "llmoxide-server"
description = "OpenAI-compatible HTTP API and the private REPL, over the llmoxide engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# `private` is what `llmoxide-private` is: locked, self-zeroing conversation
# memory. Consumers that only want inference leave it off.
llmoxide = { workspace = true, features = ["gpu", "private", "vision"] }
chat.workspace = true
model.workspace = true
tokenizer.workspace = true
secret.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
# Line editing for the private REPL. Default features off: no file history
# support is even compiled in, so there is no code path that could write one.
rustyline = { version = "18", default-features = false }

[[bin]]
name = "llmoxide-private"
path = "src/bin/llmoxide-private.rs"
