# Deliberately outside the workspace (see the root `exclude`): this crate only
# ever builds for wasm32, and being a member would drag wasm-bindgen and
# web-sys into every native `cargo build`. That also means no field
# inheritance, hence the literals below.
[package]
name = "llmoxide-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Standalone package, not a member of the workspace above it.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gguf = { path = "../gguf" }
tokenizer = { path = "../tokenizer" }
model = { path = "../model" }
chat = { path = "../chat" }
gpu = { path = "../gpu" }
secret = { path = "../secret" }
anyhow = "1"
serde_json = "1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["File", "Blob", "console"]

# `opt-level = "s"` costs ~15% decode throughput here for ~200 KB of wasm; the
# model is gigabytes, so the trade is the wrong way round.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
