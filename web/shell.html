<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmoxide · an LLM in the browser</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;      --panel: #ffffff;   --ink: #1a1917;
    --dim: #6b6862;     --line: #e3ded6;    --accent: #a5541f;
    --user: #2f5d50;    --err: #a02020;     --ok: #3f7a4a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a;    --panel: #1d1c22;   --ink: #e9e6e0;
      --dim: #918c85;   --line: #302e36;    --accent: #e0913f;
      --user: #7fc4ac;  --err: #ef8080;     --ok: #86c98f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 var(--mono);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 18px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  #status { margin-top: 5px; color: var(--dim); font-size: 12.5px;
            white-space: pre-wrap; word-break: break-word; }
  #status.err { color: var(--err); }

  main { flex: 1; overflow-y: auto; padding: 18px; }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* -- loader ---------------------------------------------------------- */
  #loader { border: 1px dashed var(--line); border-radius: 8px;
            padding: 28px 22px; text-align: center; background: var(--panel); }
  #loader.drag { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  #loader p { margin: 0 0 14px; color: var(--dim); }
  #loader p.lead { color: var(--ink); margin-bottom: 6px; }
  button {
    font: inherit; padding: 7px 15px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #opts { margin-top: 18px; font-size: 12.5px; color: var(--dim); }
  #opts summary { cursor: pointer; }
  #opts label { display: inline-block; margin: 9px 14px 0 0; }
  #opts input { font: inherit; width: 6.5em; padding: 3px 6px; margin-left: 5px;
                border: 1px solid var(--line); border-radius: 4px;
                background: var(--bg); color: var(--ink); }

  #bar { display: none; margin-top: 18px; }
  #bar .track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  #bar .cap { margin-top: 7px; font-size: 12.5px; color: var(--dim); }

  /* -- transcript ------------------------------------------------------ */
  #log { display: none; white-space: pre-wrap; word-break: break-word; }
  .turn { margin-bottom: 16px; }
  .turn .who { color: var(--dim); font-size: 12px; margin-bottom: 3px; }
  .turn.user .body { color: var(--user); }
  .turn.sys .body  { color: var(--dim); }
  .turn.err .body  { color: var(--err); }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* -- prompt ---------------------------------------------------------- */
  footer { flex: none; border-top: 1px solid var(--line); background: var(--panel);
           padding: 10px 18px; display: none; }
  .row { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-start; gap: 10px; }
  .caret { color: var(--accent); font-weight: 600; padding-top: 5px; }
  textarea {
    flex: 1; font: inherit; resize: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; background: var(--bg); color: var(--ink);
    min-height: 34px; max-height: 40vh; overflow-y: auto;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { max-width: 860px; margin: 6px auto 0; font-size: 11.5px; color: var(--dim); }
</style>

<header>
  <h1>llmoxide <span>· WebGPU · gemma4 and Qwen3</span></h1>
  <div id="status">starting…</div>
</header>

<main>
  <div class="wrap">
    <div id="loader">
      <p class="lead" id="lead">Load a model to start.</p>
      <p id="sub">Downloaded once and cached, or read straight off your disk.
        Either way it goes into GPU memory and is never uploaded anywhere.</p>
      <input type="file" id="file" accept=".gguf" hidden>
      <button id="get">Download model</button>
      <button id="pick">Use a local file…</button>
      <details id="opts">
        <summary>options</summary>
        <label>context<input id="ctx" type="number" value="4096" min="512" step="512"></label>
        <label>prefill batch<input id="batch" type="number" value="128" min="1" step="1"></label>
        <label>max reply<input id="maxtok" type="number" value="1024" min="1" step="1"></label>
      </details>
      <div id="bar">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="cap" id="cap"></div>
      </div>
    </div>
    <div id="log"></div>
  </div>
</main>

<footer>
  <div class="row">
    <span class="caret">»</span>
    <textarea id="input" rows="1" placeholder="ask something… (enter to send, shift-enter for a newline)"></textarea>
    <button id="stop" disabled>stop</button>
  </div>
  <div class="hint">/help · /wipe · /new</div>
</footer>

<script id="wasm-b64" type="text/plain">@WASM_BASE64@</script>

<script type="module">
/* ---------------------------------------------------------------- glue -- */
@GLUE@
/* ------------------------------------------------------------- the app -- */

/* The checkpoint this page offers to download. Point it at your own copy —
   any static host will do, no Range support required, since the file is
   fetched whole and then cached. `?model=<url>` overrides it for testing. */
const MODEL_URL = new URLSearchParams(location.search).get("model")
  || "./Qwen3-0.6B-Q8_0.gguf";
/* Above this, skip the Cache API: storing a second copy of a multi-gigabyte
   checkpoint is worse than re-reading it, and quota rejections are silent. */
const CACHE_LIMIT = 2e9;

const $ = (id) => document.getElementById(id);
const statusEl = $("status"), loader = $("loader"), log = $("log");
const bar = $("bar"), fill = $("fill"), cap = $("cap");
const input = $("input"), stopBtn = $("stop");

let session = null, busy = false;

const fmt = (n) =>
  n >= 1e9 ? (n / 1e9).toFixed(2) + " GB"
: n >= 1e6 ? (n / 1e6).toFixed(0) + " MB"
: n >= 1e3 ? (n / 1e3).toFixed(0) + " kB" : n + " B";

function say(kind, who, text) {
  const t = document.createElement("div");
  t.className = "turn " + kind;
  if (who) { const h = document.createElement("div"); h.className = "who"; h.textContent = who; t.append(h); }
  const b = document.createElement("div"); b.className = "body"; b.textContent = text || "";
  t.append(b); log.append(t);
  document.querySelector("main").scrollTop = 1e9;
  return b;
}

function status(text, isErr) {
  statusEl.textContent = text;
  statusEl.classList.toggle("err", !!isErr);
}

/* -- boot ---------------------------------------------------------------- */

/** Decode the inlined module. `atob` gives a binary string; the loop is ~10x
 *  faster than `Uint8Array.from(s, c => c.charCodeAt(0))` at this size. */
function wasmBytes() {
  const s = atob($("wasm-b64").textContent.trim());
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

(async () => {
  if (!navigator.gpu) {
    status("This browser has no WebGPU. Chrome or Edge 113+, or Safari 26+, "
         + "on a machine with a GPU. Nothing else here will work.", true);
    $("pick").disabled = true;
    $("get").disabled = true;
    return;
  }
  try {
    await __wbg_init({ module_or_path: wasmBytes() });
  } catch (e) {
    status("could not start the wasm module: " + e, true);
    return;
  }
  const a = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!a) { status("WebGPU is present but no adapter would open.", true); return; }
  const lim = a.limits;
  status(`ready · max buffer ${fmt(lim.maxBufferSize)}`
       + ` · max storage binding ${fmt(lim.maxStorageBufferBindingSize)}`);
})();

/* -- getting the bytes --------------------------------------------------- */

/** The model as a Blob, from the HTTP cache when it is already there.
 *
 *  Fetched whole rather than by ranges: one request a static host can serve
 *  and a CDN can cache, instead of hundreds it may not support at all. The
 *  wasm side still reads it in slices, so linear memory never holds it. */
async function blobFromUrl(url, onProgress) {
  // `caches` is undefined outside a secure context — file:// among them — so
  // this is a best-effort fast path, never a requirement.
  let store = null;
  try { store = await caches.open("llmoxide-models"); } catch { /* no cache */ }

  if (store) {
    const hit = await store.match(url).catch(() => null);
    if (hit) { onProgress("reading cached model", 0, 0); return await hit.blob(); }
  }

  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
  const total = +res.headers.get("content-length") || 0;

  // Stream it so the progress bar means something on a slow connection.
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    onProgress("downloading model", got, total);
  }
  const blob = new Blob(chunks);
  if (store && blob.size < CACHE_LIMIT) {
    // A failed put (quota, private window) must not fail the load.
    await store.put(url, new Response(blob)).catch(() => {});
  }
  return blob;
}

/* -- loading a checkpoint ------------------------------------------------ */

$("get").onclick = async () => {
  $("get").disabled = true; $("pick").disabled = true;
  bar.style.display = "block";
  try {
    const t0 = performance.now();
    const blob = await blobFromUrl(MODEL_URL, (stage, done, total) => {
      if (total > 0) {
        fill.style.width = (100 * done / total).toFixed(1) + "%";
        const rate = done / ((performance.now() - t0) / 1000);
        cap.textContent = `${stage} — ${fmt(done)} / ${fmt(total)}  (${fmt(rate)}/s)`;
      } else { cap.textContent = stage + "…"; }
    });
    await open(blob, MODEL_URL.split("/").pop());
  } catch (e) {
    bar.style.display = "none";
    $("get").disabled = false; $("pick").disabled = false;
    status("download failed: " + e, true);
  }
};

$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => { const f = e.target.files[0]; if (f) open(f, f.name); };

for (const ev of ["dragenter", "dragover"])
  loader.addEventListener(ev, (e) => { e.preventDefault(); loader.classList.add("drag"); });
for (const ev of ["dragleave", "drop"])
  loader.addEventListener(ev, (e) => { e.preventDefault(); loader.classList.remove("drag"); });
loader.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) open(f, f.name);
});

async function open(file, name) {
  $("pick").disabled = true;
  $("get").disabled = true;
  bar.style.display = "block";
  const t0 = performance.now();

  const onProgress = (stage, done, total) => {
    if (total > 0) {
      fill.style.width = (100 * done / total).toFixed(1) + "%";
      const rate = done / ((performance.now() - t0) / 1000);
      cap.textContent = `${stage} — ${fmt(done)} / ${fmt(total)}  (${fmt(rate)}/s)`;
    } else {
      cap.textContent = stage + "…";
    }
  };

  try {
    session = await load(file, +$("ctx").value, +$("batch").value, onProgress);
  } catch (e) {
    bar.style.display = "none";
    $("pick").disabled = false;
    $("get").disabled = false;
    status("load failed: " + e, true);
    return;
  }

  status(session.info);
  loader.style.display = "none";
  log.style.display = "block";
  document.querySelector("footer").style.display = "block";
  say("sys", null, `${name} loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s.\n`
                 + "/help for commands.");
  input.focus();
}

/* -- the REPL ------------------------------------------------------------ */

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});

stopBtn.onclick = () => { if (busy) request_stop(); };

const HELP = "/wipe   overwrite the conversation and every device buffer it touched\n"
           + "/new    same, but stay in the session\n"
           + "/help   this\n"
           + "enter sends · shift-enter adds a newline · stop halts a reply";

async function submit() {
  const text = input.value.trim();
  if (!text || busy || !session) return;
  input.value = "";
  input.style.height = "auto";

  if (text === "/help") { say("sys", null, HELP); return; }
  if (text === "/wipe" || text === "/new") {
    session.wipe();
    if (text === "/wipe") log.replaceChildren();
    say("sys", null, "wiped: conversation, device buffers, locked pages.");
    return;
  }

  say("user", "»", text);
  const body = say("", "model", "");
  body.classList.add("cursor");

  busy = true;
  stopBtn.disabled = false;
  input.disabled = true;
  const t0 = performance.now();
  let n = 0;

  try {
    await session.reply(text, +$("maxtok").value, (piece) => {
      body.textContent += piece;
      n++;
      document.querySelector("main").scrollTop = 1e9;
    });
    const dt = (performance.now() - t0) / 1000;
    status(`${session.info}\n${n} tokens in ${dt.toFixed(1)}s — ${(n / dt).toFixed(1)} tok/s`);
  } catch (e) {
    say("err", null, "error: " + e);
  } finally {
    body.classList.remove("cursor");
    busy = false;
    stopBtn.disabled = true;
    input.disabled = false;
    input.focus();
  }
}
</script>
