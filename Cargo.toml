[workspace]
resolver = "2"
members = ["crates/gguf", "crates/tokenizer", "crates/model", "crates/gpu", "crates/chat", "crates/vision", "crates/secret", "crates/hub", "crates/server", "llmoxide"]
# Neither of these is a workspace member. `crates/wasm` is built for wasm32
# only (`scripts/build-web.sh`), and membership would pull wasm-bindgen into
# every native build for nothing. `crates/app` pulls in a whole renderer, and
# blitz-dom pins `image = "=0.25.6"` exactly, which in a shared lockfile would
# drag the vision crate's decoders back to the versions it pins.
exclude = ["crates/wasm", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/bigmah/llmoxide"

[workspace.dependencies]
# The crates of this workspace. Packages are `llmoxide-*` so they do not squat
# generic names in a consumer's dependency graph; the rename here is what keeps
# `use gguf::...` working unchanged inside the workspace. Members inherit these
# with a bare `gguf.workspace = true`.
gguf = { package = "llmoxide-gguf", path = "crates/gguf", version = "0.1.0" }
tokenizer = { package = "llmoxide-tokenizer", path = "crates/tokenizer", version = "0.1.0" }
model = { package = "llmoxide-model", path = "crates/model", version = "0.1.0" }
gpu = { package = "llmoxide-gpu", path = "crates/gpu", version = "0.1.0" }
chat = { package = "llmoxide-chat", path = "crates/chat", version = "0.1.0" }
vision = { package = "llmoxide-vision", path = "crates/vision", version = "0.1.0" }
secret = { package = "llmoxide-secret", path = "crates/secret", version = "0.1.0" }
hub = { package = "llmoxide-hub", path = "crates/hub", version = "0.1.0" }
llmoxide = { path = "llmoxide", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
wgpu = "27"
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
