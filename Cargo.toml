[workspace]
resolver = "2"
members = ["crates/gguf", "crates/tokenizer", "crates/model", "crates/gpu", "crates/chat", "crates/secret", "crates/hub", "crates/server", "llmoxide"]
# Built for wasm32 only (`scripts/build-web.sh`), never for the host, so it is
# not a workspace member — `cargo build` would pull wasm-bindgen into every
# native build for nothing.
exclude = ["crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
wgpu = "27"
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
